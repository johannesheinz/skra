<!doctype html>
<html lang="{{.Lang}}"{{if .User}} data-theme-managed{{end}}{{with .Theme}}{{if .Mode}} data-theme="{{.Mode}}"{{end}}{{if .Flavor}} data-flavor="{{.Flavor}}"{{end}}{{if .Accent}} data-accent="{{.Accent}}"{{end}}{{end}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>{{block "title" .}}Skrá{{end}}</title>
  <link rel="icon" type="image/svg+xml" href="{{static "img/skra-favicon.svg"}}">
  <script src="{{static "js/theme.js"}}"></script>
  <link rel="stylesheet" href="{{static "css/app.css"}}">
  <script src="{{static "js/htmx-v2.0.9.min.js"}}" defer></script>
  <script src="{{static "js/photo.js"}}" defer></script>
  <script src="{{static "js/prefs.js"}}" defer></script>
  <script src="{{static "js/birthday.js"}}" defer></script>
  <script src="{{static "js/rows.js"}}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{t "skip_to_content"}}</a>
  <header class="appbar">
    <a class="brand" href="/" aria-label="{{t "brand.home"}}">
      <svg class="brand-mark" viewBox="0 0 104 80" fill="none" aria-hidden="true">
        <rect x="6" y="10" width="92" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="26" cy="35" r="8" fill="currentColor"/>
        <path d="M14 58 Q14 46 26 46 Q38 46 38 58 Z" fill="currentColor"/>
        <g transform="translate(8.226,108.107) scale(0.1050,-0.1050)" fill="currentColor">
          <path d="M216.899169921875 553.39990234375 292.299072265625 695.80029296875H411.20068359375L310.100341796875 553.39990234375Z"/>
        </g>
        <rect x="60" y="31" width="30" height="5" rx="2.5" fill="currentColor"/>
        <rect x="60" y="43" width="22" height="5" rx="2.5" fill="currentColor"/>
        <rect x="60" y="55" width="26" height="5" rx="2.5" fill="currentColor"/>
      </svg>
      <span class="brand-word">Skrá</span>
    </a>
    <div class="appbar-right">
      {{with .User}}
      <nav class="appnav">
        <a href="/books" aria-label="{{t "nav.address_books"}}" title="{{t "nav.address_books"}}">{{icon "book-open"}} <span class="nav-label">{{t "nav.address_books"}}</span></a>
        {{if eq .Role "admin"}}<a href="/admin/users" aria-label="{{t "nav.users"}}" title="{{t "nav.users"}}">{{icon "users"}} <span class="nav-label">{{t "nav.users"}}</span></a>{{end}}
        <a href="/account" aria-label="{{t "nav.account"}}" title="{{.Username}}">{{icon "settings"}} <span class="nav-label">{{.Username}}</span></a>
        <form method="post" action="/logout">
          <button class="btn-secondary" type="submit" aria-label="{{t "nav.sign_out"}}" title="{{t "nav.sign_out"}}">{{icon "log-out"}} <span class="nav-label">{{t "nav.sign_out"}}</span></button>
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        </form>
      </nav>
      {{end}}
      {{if .User}}
      <form method="post" action="/account/theme" class="theme-toggle-form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="return" value="{{.Path}}">
        <button class="theme-toggle" type="submit" aria-label="{{t "nav.toggle_theme"}}" title="Toggle light/dark (saved to your account)">{{icon "contrast"}}</button>
      </form>
      {{else}}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="{{t "nav.toggle_theme"}}" title="Toggle theme">{{icon "contrast"}}</button>
      {{end}}
    </div>
  </header>
  <main id="main" class="container stack">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
