<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{block "title" .}}Skrá{{end}}</title>
  <link rel="icon" type="image/svg+xml" href="{{static "img/skra-favicon.svg"}}">
  <link rel="stylesheet" href="{{static "css/app.css"}}">
  <script src="{{static "js/htmx-v2.0.9.min.js"}}" defer></script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/">Skrá</a>
    {{with .User}}
    <nav class="appnav">
      <a href="/books">Address books</a>
      <span class="muted">{{.Username}}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <button class="btn-secondary" type="submit">Sign out</button>
      </form>
    </nav>
    {{end}}
  </header>
  <main class="container stack">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
