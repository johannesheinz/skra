{{define "title"}}Address books · Skrá{{end}}
{{define "content"}}
<h1>Address books</h1>
<p><a class="btn" href="/books/new">{{icon "plus"}} New address book</a></p>
{{if .Books}}
<table>
  <thead><tr><th>Name</th><th>Contacts</th></tr></thead>
  <tbody>
  {{range .Books}}
    <tr>
      <td><a href="/books/{{.PublicID}}">{{.Name}}</a></td>
      <td>{{.ContactCount}}</td>
    </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p class="muted">No address books yet.</p>
{{end}}
{{end}}
