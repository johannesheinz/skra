{{define "title"}}{{t "import.title"}} · Skrá{{end}}
{{define "content"}}
<p><a href="/books/{{.Book.PublicID}}">← {{.Book.Name}}</a></p>
<h1>{{t "import.title"}}</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<p class="muted">{{t "import.desc"}}</p>
<form class="stack" method="post" action="{{.UploadURL}}" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>{{t "import.vcard_file"}}
    <input type="file" name="file" accept=".vcf,text/vcard" required>
  </label>
  <button type="submit">{{t "import.preview"}}</button>
</form>
{{end}}
