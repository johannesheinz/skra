{{define "title"}}Import · Skrá{{end}}
{{define "content"}}
<p><a href="/books/{{.Book.PublicID}}">← {{.Book.Name}}</a></p>
<h1>Import contacts</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<p class="muted">Upload a vCard file (.vcf). You will see a preview before anything is saved.</p>
<form class="stack" method="post" action="{{.UploadURL}}" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>vCard file
    <input type="file" name="file" accept=".vcf,text/vcard" required>
  </label>
  <button type="submit">Preview import</button>
</form>
{{end}}
