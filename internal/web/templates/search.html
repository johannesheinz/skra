{{define "title"}}{{t "search.title"}} · Skrá{{end}}
{{define "content"}}
<h1>{{t "search.title"}}</h1>

<form class="global-search" role="search" method="get" action="/search"
      hx-get="/search" hx-target="#search-results" hx-swap="innerHTML"
      hx-trigger="input changed delay:300ms, search, submit" hx-push-url="true">
  <input type="search" name="q" value="{{.Query}}" placeholder="{{t "search.placeholder"}}" aria-label="{{t "search.placeholder"}}" autocomplete="off" autofocus>
  <button class="btn btn-secondary btn-icon" type="submit" aria-label="{{t "common.search"}}" title="{{t "common.search"}}">{{icon "search"}}</button>
</form>

<div id="search-results" aria-live="polite">
  {{template "search_results" .}}
</div>
{{end}}
