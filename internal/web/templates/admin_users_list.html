{{define "title"}}Users · Skrá{{end}}
{{define "content"}}
<h1>Users</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<p><a class="btn" href="/admin/users/new">New user</a></p>
<div class="table-wrap"><table>
  <thead><tr><th>Username</th><th>Email</th><th>Role</th><th></th></tr></thead>
  <tbody>
  {{range .Users}}
  <tr>
    <td>{{.Username}}</td>
    <td>{{.Email}}</td>
    <td>{{.Role}}</td>
    <td><a href="/admin/users/{{.PublicID}}/edit">Edit</a></td>
  </tr>
  {{end}}
  </tbody>
</table></div>
{{end}}
