{{define "title"}}{{.Heading}} · Skrá{{end}}
{{define "content"}}
<h1>{{.Heading}}</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<form class="stack" method="post" action="{{.FormAction}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>Name
    <input type="text" name="name" value="{{.Name}}" required autofocus>
  </label>
  <label>Description
    <textarea name="description" rows="3">{{.Description}}</textarea>
  </label>
  <div>
    <button type="submit">Save</button>
    <a class="btn btn-secondary" href="/books">Cancel</a>
  </div>
</form>
{{end}}
