{{define "title"}}{{t .HeadingKey}} · Skrá{{end}}
{{define "content"}}
<h1>{{t .HeadingKey}}</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<form class="stack" method="post" action="{{.FormAction}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>{{t "book_form.name"}}
    <input type="text" name="name" value="{{.Name}}" required autofocus>
  </label>
  <label>{{t "book_form.description"}}
    <textarea name="description" rows="3">{{.Description}}</textarea>
  </label>
  <div>
    <button type="submit">{{t "common.save"}}</button>
    <a class="btn btn-secondary" href="/books">{{t "common.cancel"}}</a>
  </div>
</form>
{{end}}
