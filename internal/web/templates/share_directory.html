{{define "title"}}{{.Book.Name}} · Skrá{{end}}
{{define "content"}}
<h1>{{.Book.Name}}</h1>
{{if .Book.Description}}<p class="muted">{{.Book.Description}}</p>{{end}}

<div class="actions">
  <a class="btn btn-secondary" href="{{.ExportVCF}}">Export vCard</a>
  <a class="btn btn-secondary" href="{{.ExportCSV}}">Export CSV</a>
</div>

{{if .Cards}}
{{template "contact_cards" .Cards}}
{{else}}
<p class="muted">No contacts.</p>
{{end}}
{{end}}
