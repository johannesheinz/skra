{{define "title"}}{{.Book.Name}} · Skrá{{end}}
{{define "content"}}
<h1>{{.Book.Name}}</h1>
{{if .Book.Description}}<p class="muted">{{.Book.Description}}</p>{{end}}

<div class="actions">
  <a class="btn btn-secondary" href="{{.ExportVCF}}">{{t "share.export_vcard"}}</a>
  <a class="btn btn-secondary" href="{{.ExportCSV}}">{{t "share.export_csv"}}</a>
</div>

{{if .Cards}}
{{template "contact_cards" .Cards}}
{{else}}
<p class="muted">{{t "share.no_contacts"}}</p>
{{end}}
{{end}}
