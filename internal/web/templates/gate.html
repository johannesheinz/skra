{{define "title"}}{{t "gate.title"}} · Skrá{{end}}
{{define "content"}}
<h1>{{t "gate.title"}}</h1>
<p class="muted">{{t "gate.desc"}}</p>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<form class="stack" method="post" action="{{.GateAction}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>{{t "gate.secret"}}
    <input type="password" name="secret" required autofocus>
  </label>
  <button type="submit">{{t "gate.view"}}</button>
</form>
{{end}}
